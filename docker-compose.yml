# MySQL local para desarrollo: `docker compose up -d`
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sm_repuestos
      MYSQL_USER: sm
      MYSQL_PASSWORD: sm_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
